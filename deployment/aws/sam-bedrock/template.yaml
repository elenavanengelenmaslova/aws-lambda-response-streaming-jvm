AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Bedrock streaming endpoint - a Kotlin/JVM Lambda behind an API Gateway REST proxy
  integration that relays Amazon Bedrock Nova Lite token deltas to the client via response
  streaming (RESPONSE_STREAM). To make token-by-token delivery visible through API Gateway
  REST, each SSE event is padded past the Lambda streaming runtime's internal buffer (~100 KB)
  with tiered SSE-comment padding (see the module README). Cold-start optimized with SnapStart
  + tiered compilation on arm64/Java 25.

Parameters:
  MemorySizeMb:
    Type: Number
    Default: 1024
    MinValue: 128
    MaxValue: 1024
    Description: Lambda memory size in MB (bounded 128-1024).
  TimeoutSeconds:
    Type: Number
    Default: 300
    MinValue: 1
    MaxValue: 300
    Description: Lambda timeout in seconds (bounded 1-300, within the API Gateway 300s regional idle timeout).
  LogRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 7
    Description: CloudWatch log retention in days (finite, 1-7).
  NovaLiteProfileId:
    Type: String
    Default: eu.amazon.nova-lite-v1:0
    Description: Bedrock Nova Lite inference-profile id (EU cross-region).

# Runtime and architecture are set once here and inherited by every function.
# Do NOT override Runtime or Architectures per function.
Globals:
  Function:
    Runtime: java25
    Architectures:
      - arm64

Resources:
  # ---------------------------------------------------------------------------
  # REST API with proxy integration. Response streaming is enabled per-route via
  # the function's Api event property ResponseTransferMode: RESPONSE_STREAM.
  # ---------------------------------------------------------------------------
  BedrockStreamingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: BedrockStreamingApiUsagePlan

  # ---------------------------------------------------------------------------
  # The streaming Lambda. RequestStreamHandler that writes the API Gateway
  # streaming protocol by hand and relays Nova Lite deltas as padded SSE events.
  # ---------------------------------------------------------------------------
  BedrockStreamingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bedrock-streaming-endpoint
      Handler: nl.vintik.lambda.bedrock.BedrockStreamingHandler
      CodeUri: ../../../build/dist/bedrock-streaming-endpoint.jar
      MemorySize: !Ref MemorySizeMb
      Timeout: !Ref TimeoutSeconds
      # Cold-start optimization: SnapStart with an auto-published 'live' alias.
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          # Tiered compilation stop-at level 1 for faster restore-time warmup.
          JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      # Least privilege: only InvokeModelWithResponseStream, only on the Nova Lite
      # inference profile and the regional foundation-model copies it routes to.
      Policies:
        - Statement:
            - Sid: InvokeNovaLiteStreamingOnly
              Effect: Allow
              Action: bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${NovaLiteProfileId}"
                - "arn:aws:bedrock:eu-west-3::foundation-model/amazon.nova-lite-v1:0"
                - "arn:aws:bedrock:eu-west-1::foundation-model/amazon.nova-lite-v1:0"
                - "arn:aws:bedrock:eu-central-1::foundation-model/amazon.nova-lite-v1:0"
                - "arn:aws:bedrock:eu-north-1::foundation-model/amazon.nova-lite-v1:0"
      Events:
        StreamPost:
          Type: Api
          Properties:
            RestApiId: !Ref BedrockStreamingApi
            Path: /stream
            Method: post
            # MUST be exactly RESPONSE_STREAM (SAM). The lower-level integration
            # value STREAM is NOT interchangeable - see docs/log.md.
            ResponseTransferMode: RESPONSE_STREAM
    # No ProvisionedConcurrencyConfig - no always-on capacity.

  # ---------------------------------------------------------------------------
  # CloudWatch log group with a finite 7-day retention. The name matches the
  # alias-published function so SnapStart invocations log here too.
  # ---------------------------------------------------------------------------
  BedrockStreamingFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BedrockStreamingFunction}"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  StreamingEndpointUrl:
    Description: Base HTTPS URL of the Bedrock streaming endpoint (POST /stream with a JSON prompt body).
    Value: !Sub "https://${BedrockStreamingApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  FunctionName:
    Description: Name of the streaming Lambda function.
    Value: !Ref BedrockStreamingFunction
  FunctionLiveAliasArn:
    Description: ARN of the SnapStart 'live' alias.
    Value: !Ref BedrockStreamingFunction.Alias
  ApiKeyId:
    Description: ID of the API key (use `aws apigateway get-api-key --api-key <id> --include-value` to retrieve the value).
    Value: !Ref BedrockStreamingApiApiKey
