name: CI - Feature Build, Deploy & Test

on:
  push:
    branches:
      - 'feature/**'

permissions:
  id-token: write
  contents: read

# Every deploying workflow shares ONE concurrency group, deliberately without the ref in the name.
# The stack names are fixed per account and region, so a run from main and a run from a feature
# branch update the same CloudFormation stacks; serialising per branch would not have helped. With
# cancel-in-progress false a second run waits instead of racing, which is what previously produced
# "Stack ... is in UPDATE_IN_PROGRESS state and can not be updated" when a push and an on-demand
# dispatch overlapped. Keep this group identical in cd-deploy-on-demand.yml.
concurrency:
  group: aws-stack-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/workflow-build.yml

  deploy:
    needs: test
    strategy:
      # Deploy both example stacks. fail-fast disabled so one stack's failure
      # does not cancel the other's deploy.
      fail-fast: false
      matrix:
        include:
          - sam-dir: deployment/aws/sam
            stack-name: s3-file-streaming-endpoint
            build-task: ':streaming-s3-example:build'
            jar-name: streaming-endpoint.jar
          - sam-dir: deployment/aws/sam-java
            stack-name: java-s3-file-streaming-endpoint
            build-task: ':streaming-s3-example-java:build'
            jar-name: streaming-endpoint-java.jar
          - sam-dir: deployment/aws/sam-bedrock
            stack-name: bedrock-streaming-endpoint
            build-task: ':streaming-bedrock-example:build'
            # The ZIP, not the jar: this endpoint streams for real, which needs the fat jar loaded
            # as a -javaagent, which needs a real jar FILE inside the package. The jar is still
            # built, so naming it here would let a missing zip reach SAM unnoticed.
            jar-name: bedrock-streaming-endpoint.zip
          - sam-dir: deployment/aws/sam-bedrock-java
            stack-name: bedrock-streaming-endpoint-java
            build-task: ':streaming-bedrock-example-java:build'
            # Same ZIP packaging as the Kotlin Bedrock stack (fat jar loaded as a -javaagent).
            jar-name: bedrock-streaming-endpoint-java.zip
            # The template's LogRetentionDays has MinValue 14; the deploy default of 7 would fail.
            log-retention-days: '14'
    uses: ./.github/workflows/workflow-deploy-aws.yml
    with:
      environment: default
      aws-region: eu-west-1
      github-actions-role-name: ${{ vars.OIDC_ROLE_NAME }}
      sam-dir: ${{ matrix.sam-dir }}
      stack-name: ${{ matrix.stack-name }}
      build-task: ${{ matrix.build-task }}
      jar-name: ${{ matrix.jar-name }}
      log-retention-days: ${{ matrix.log-retention-days }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  streaming-tests:
    needs: deploy
    # GitHub Actions cannot express "this test leg needs only its own stack's deploy leg": `needs`
    # on a matrix job waits for every leg, and a single failed leg would otherwise skip ALL tests.
    # That happened once — an unrelated S3 deploy failure skipped the Bedrock test that had been
    # explicitly requested. `!cancelled()` runs the tests anyway, so each stack is judged on its
    # own result. A test against a stack whose deploy did fail then fails loudly, which is the
    # useful outcome; cancelled runs are still excluded so a cancellation cannot trigger paid tests.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack-name: s3-file-streaming-endpoint
            test-script: scripts/pipeline-streaming-test.sh
            test-object-key: streaming-test-12mb.bin
          - stack-name: java-s3-file-streaming-endpoint
            test-script: scripts/pipeline-streaming-test.sh
            test-object-key: streaming-test-12mb-java.bin
          # The Bedrock example's test invokes paid Bedrock, so it stays DISABLED on every
          # feature push (the script exits 0 cleanly when BEDROCK_TEST_ENABLED is not "true").
          # This proves the deploy + test wiring without incurring model cost on each branch;
          # run the paid test on demand via "CD - Deploy On Demand" with run-bedrock-test=true.
          - stack-name: bedrock-streaming-endpoint
            test-script: scripts/bedrock-streaming-test.sh
            test-object-key: ''
          - stack-name: bedrock-streaming-endpoint-java
            test-script: scripts/bedrock-streaming-test.sh
            test-object-key: ''
    uses: ./.github/workflows/workflow-streaming-test.yml
    with:
      aws-region: eu-west-1
      github-actions-role-name: ${{ vars.OIDC_ROLE_NAME }}
      stack-name: ${{ matrix.stack-name }}
      test-script: ${{ matrix.test-script }}
      test-object-key: ${{ matrix.test-object-key }}
      bedrock-test-enabled: 'false'
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
