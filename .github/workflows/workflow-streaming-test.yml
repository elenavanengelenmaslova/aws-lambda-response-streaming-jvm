name: Reusable - Streaming Test

on:
  workflow_call:
    inputs:
      aws-region:
        required: false
        type: string
        default: 'eu-west-1'
        description: 'AWS region'
      github-actions-role-name:
        required: false
        type: string
        default: 'StreamingExampleGitHubActionsRole'
        description: 'Name of the GitHub Actions OIDC role'
      stack-name:
        required: false
        type: string
        default: 's3-file-streaming-endpoint'
        description: 'CloudFormation stack name whose outputs the streaming test resolves'
      function-url:
        required: false
        type: string
        default: ''
        description: 'Deployed Lambda Function URL (from the deploy job output); when empty the Function URL check resolves it from the stack output'
      test-script:
        required: false
        type: string
        default: 'scripts/pipeline-streaming-test.sh'
        description: 'Pipeline streaming-test script to run against the deployed stack'
      test-object-key:
        required: false
        type: string
        default: 'streaming-test-12mb.bin'
        description: 'S3 object key the streaming test seeds and streams'
    secrets:
      AWS_ACCOUNT_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  streaming-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.github-actions-role-name }}
          role-session-name: StreamingExampleTest
          aws-region: ${{ inputs.aws-region }}

      - name: Run streaming pipeline tests
        env:
          STACK_NAME: ${{ inputs.stack-name || 's3-file-streaming-endpoint' }}
          AWS_REGION: ${{ inputs.aws-region }}
          TEST_OBJECT_KEY: ${{ inputs.test-object-key || 'streaming-test-12mb.bin' }}
          TEST_SCRIPT: ${{ inputs.test-script || 'scripts/pipeline-streaming-test.sh' }}
        run: ./"$TEST_SCRIPT"

      # Run the signed Function URL verification (AuthType: AWS_IAM) IN ADDITION
      # to the API Gateway checks above (function-url-streaming Req 9.1, 9.7).
      # post-deploy-test.sh resolves the Function URL from the stack output when
      # FUNCTION_URL is empty, so the correct per-stack Function URL is always
      # used across the matrix. The OIDC credentials exported by
      # configure-aws-credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
      # AWS_SESSION_TOKEN) are present in the job env for SigV4 signing — the
      # Function URL path always signs and never falls back to unsigned.
      - name: Verify Function URL streaming (signed)
        env:
          STACK_NAME: ${{ inputs.stack-name || 's3-file-streaming-endpoint' }}
          AWS_REGION: ${{ inputs.aws-region }}
          FUNCTION_URL: ${{ inputs.function-url }}
        run: ./scripts/post-deploy-test.sh
