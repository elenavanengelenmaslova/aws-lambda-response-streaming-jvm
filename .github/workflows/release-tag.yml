name: Release - compute, tag, README PR

# Upstream of workflow-publish.yml. Reacts only to changes in the published library's
# production sources or build file (Library_Source_Paths). A README-only merge touches
# neither path, so the path filter structurally prevents a release re-trigger loop (Req 6).
on:
  push:
    branches: [main]
    paths:
      - 'streaming-core/src/main/**'
      - 'streaming-core/build.gradle.kts'

jobs:
  # Compute the next SemVer version from Conventional Commits since the latest tag.
  # Read-only: the version script only inspects git history and tags (Req 7.1 least-privilege).
  compute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      bump: ${{ steps.compute.outputs.bump }}
      exists: ${{ steps.compute.outputs.exists }}
    steps:
      # fetch-depth: 0 so all tags and full history are present; without it
      # `git tag --list` and `latest..HEAD` are unreliable.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The script appends version=/bump=/exists= to the GitHub-provided $GITHUB_OUTPUT.
      # The step id lets downstream jobs read steps.compute.outputs.* and promotes them
      # to job-level outputs for needs.compute.outputs.*.
      - name: Compute next version
        id: compute
        run: scripts/release/compute-version.sh
  # Create and push the vX.Y.Z tag, then create the GitHub Release (draft-first,
  # verified non-empty, then published). This job NEVER publishes to Maven Central —
  # pushing the tag is the only handoff; workflow-publish.yml fires off that tag push
  # in parallel (Req 3.3). RELEASE_PAT is REQUIRED: a GITHUB_TOKEN-pushed tag does not
  # trigger on: push tag workflows, so a fallback would create a tag + Release that is
  # never published (Req 7.3). The preflight fails the run before anything is written.
  tag:
    needs: compute
    runs-on: ubuntu-latest
    # Skip entirely when there is nothing to release (Req 2 / guard). bump==none means
    # no bumpable commits since the latest tag.
    if: ${{ needs.compute.outputs.bump != 'none' }}
    permissions:
      contents: write
    env:
      version: ${{ needs.compute.outputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      # `secrets` is not available in `if:`, so the check maps the secret into env and
      # tests emptiness. The value is never echoed.
      - name: Preflight — RELEASE_PAT configured?
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::error::RELEASE_PAT is not configured. Without it the pushed tag would not trigger workflow-publish.yml. Add the repository secret and re-run."
            exit 1
          fi

      # fetch-depth: 0 so all tags/history are present for the guard.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      # Idempotency guard (Req 3.4): an existing tag is NOT treated as a finished release.
      # It means a previous run got at least as far as the tag push; this run reuses the
      # tag and only fills in whatever post-tag artifact is still missing (the Release
      # here, the README PR in readme-pr). Nothing is ever re-tagged or duplicated.
      - name: Guard — tag already exists?
        id: guard
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tag ${version} already exists — reusing it, reconciling missing post-tag artifacts"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Create + push the tag (Req 3.1, 3.2). Uses the github-actions bot identity for
      # the annotated tag. This push is the single handoff to workflow-publish.yml.
      - name: Create and push tag
        if: ${{ steps.guard.outputs.exists == 'false' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${version}" -m "Release ${version}"
          git push origin "refs/tags/${version}"

      # Create the GitHub Release draft-first, verify the generated notes are non-empty,
      # then publish (Req 4.1, 4.2, 4.4, 8.1, 8.4). Reconciling: an already-published
      # Release is left alone; a leftover draft is verified and published rather than
      # duplicated. On empty notes we delete only the draft (keeping the tag, which
      # publish already consumed) and fail. No CHANGELOG.md is created (Req 4.3).
      - name: Create GitHub Release (draft → verify → publish)
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "${version}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "${is_draft}" = "false" ]; then
              echo "::notice::Release ${version} already published — nothing to do"
              exit 0
            fi
            echo "::notice::found draft Release ${version} from an earlier run — verifying it"
          else
            gh release create "${version}" --verify-tag --generate-notes --draft --title "${version}"
          fi

          body="$(gh release view "${version}" --json body --jq '.body')"
          if [ -z "${body//[[:space:]]/}" ]; then
            echo "::error::generated release notes are empty for ${version}"
            gh release delete "${version}" --yes --cleanup-tag=false
            exit 1
          fi

          gh release edit "${version}" --draft=false

  # Open the docs-only README PR that bumps the published dependency coordinate to the
  # just-released version. Runs AFTER tag (Req 8.2) so the PR reflects a version that is
  # actually tagged/released. The commit is `chore:` with NO deps scope and touches only
  # README.md — it matches neither trigger path, so merging it can never start a release
  # run (Req 6 loop guard, structural). needs: [compute, tag] — compute for the version
  # output, tag to enforce ordering; the same bump!='none' guard as tag keeps this off the
  # no-release path.
  readme-pr:
    needs: [compute, tag]
    runs-on: ubuntu-latest
    if: ${{ needs.compute.outputs.bump != 'none' }}
    # contents: write to push the release/ branch; pull-requests: write to open the PR (Req 7.1, 7.2).
    permissions:
      contents: write
      pull-requests: write
    env:
      version: ${{ needs.compute.outputs.version }}
      # RELEASE_PAT (verified by the tag job's preflight) so the PR's on: pull_request checks
      # start without the approval step a GITHUB_TOKEN-opened PR needs (Req 7.3).
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      # fetch-depth: 0 for full history; token so the branch push is authenticated with
      # RELEASE_PAT, consistent with the tag job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      # Branch → edit → commit → push → PR (Req 5.1, 5.2, 5.3, 5.4, 8.3). The edit script
      # anchors on the coordinate and fails loudly if nothing changed. The commit message is
      # `chore: update README dependency version to X.Y.Z` — no deps scope, docs-only, so it
      # carries no bump and never re-triggers a release. version_no_v drops the leading `v`
      # to match the bare X.Y.Z coordinate in README.md.
      - name: Open README version-bump PR
        run: |
          set -euo pipefail
          version_no_v="${version#v}"
          branch="release/${version}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Reconcile (Req 3.4): a PR for this branch, open or merged, means this step
          # already happened — do not open a duplicate.
          existing="$(gh pr list --head "${branch}" --state all --json number --jq 'length')"
          if [ "${existing}" != "0" ]; then
            echo "::notice::README PR for ${branch} already exists — nothing to do"
            exit 0
          fi

          # A pushed branch without a PR (an earlier run failed at `gh pr create`) is
          # reused as-is; otherwise create it, edit, commit and push.
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            echo "::notice::branch ${branch} already pushed — opening its PR"
          else
            git switch -c "${branch}"
            scripts/release/update-readme-version.sh "${version}"
            git commit -am "chore: update README dependency version to ${version_no_v}"
            git push origin "${branch}"
          fi

          gh pr create --base main --head "${branch}" \
            --title "docs: README version ${version}" \
            --body "Automated README dependency-version bump for ${version}. Docs-only; does not re-trigger a release."
