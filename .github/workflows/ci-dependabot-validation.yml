name: CI - Dependabot Validation

on:
  push:
    branches:
      - 'dependabot/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # head_ref on pull_request, ref_name on push — both resolve to the dependabot branch name, so
  # the two events for one branch share a group instead of racing.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # pull_request offers no head-branch filter, so the head-branch check lives here. On a human
    # pull request into main this job is skipped, not run — ci-main-build.yml covers those.
    if: ${{ github.event_name == 'push' || startsWith(github.head_ref, 'dependabot/') }}
    # Build only: unit tests, coverage gates and both SAM template validations. A Dependabot run
    # gets a read-only token and a separate credential store, so this workflow hands the reusable
    # build nothing to authenticate with and passes whenever the build passes.
    uses: ./.github/workflows/workflow-build.yml
