name: CD - Deploy On Demand

on:
  workflow_dispatch:
    inputs:
      aws-region:
        description: 'AWS region for deployment'
        required: false
        default: 'eu-west-1'
        type: string
      github-actions-role-name:
        description: 'GitHub Actions OIDC role name (leave empty to use OIDC_ROLE_NAME variable)'
        required: false
        default: ''
        type: string
      run-bedrock-test:
        description: 'Run the Bedrock streaming test after deploy (invokes paid Amazon Bedrock)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

# Shares ONE concurrency group with ci-feature-build.yml, deliberately without the ref in the name:
# the stack names are fixed per account and region, so a push-triggered run and an on-demand
# dispatch update the same CloudFormation stacks whatever branch they come from. With
# cancel-in-progress false the second run waits instead of racing, which is what previously
# produced "Stack ... is in UPDATE_IN_PROGRESS state and can not be updated". Keep this group
# identical in ci-feature-build.yml.
concurrency:
  group: aws-stack-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/workflow-build.yml

  deploy:
    needs: test
    strategy:
      # Deploy both example stacks. fail-fast disabled so one stack's failure
      # does not cancel the other's deploy.
      fail-fast: false
      matrix:
        include:
          - sam-dir: deployment/aws/sam
            stack-name: s3-file-streaming-endpoint
            build-task: ':streaming-s3-example:build'
            jar-name: streaming-endpoint.jar
          - sam-dir: deployment/aws/sam-java
            stack-name: java-s3-file-streaming-endpoint
            build-task: ':streaming-s3-example-java:build'
            jar-name: streaming-endpoint-java.jar
          - sam-dir: deployment/aws/sam-bedrock
            stack-name: bedrock-streaming-endpoint
            build-task: ':streaming-bedrock-example:build'
            # The ZIP, not the jar: this endpoint streams for real, which needs the fat jar loaded
            # as a -javaagent, which needs a real jar FILE inside the package. The jar is still
            # built, so naming it here would let a missing zip reach SAM unnoticed.
            jar-name: bedrock-streaming-endpoint.zip
    uses: ./.github/workflows/workflow-deploy-aws.yml
    with:
      environment: default
      aws-region: ${{ inputs.aws-region }}
      github-actions-role-name: ${{ inputs.github-actions-role-name || vars.OIDC_ROLE_NAME }}
      sam-dir: ${{ matrix.sam-dir }}
      stack-name: ${{ matrix.stack-name }}
      build-task: ${{ matrix.build-task }}
      jar-name: ${{ matrix.jar-name }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  streaming-tests:
    needs: deploy
    # GitHub Actions cannot express "this test leg needs only its own stack's deploy leg": `needs`
    # on a matrix job waits for every leg, and a single failed leg would otherwise skip ALL tests.
    # That happened once — an unrelated S3 deploy failure skipped the Bedrock test that had been
    # explicitly requested with run-bedrock-test=true. `!cancelled()` runs the tests anyway, so
    # each stack is judged on its own result. A test against a stack whose deploy did fail then
    # fails loudly, which is the useful outcome; cancelled runs stay excluded so a cancellation
    # cannot trigger the paid Bedrock test.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack-name: s3-file-streaming-endpoint
            test-script: scripts/pipeline-streaming-test.sh
            test-object-key: streaming-test-12mb.bin
          - stack-name: java-s3-file-streaming-endpoint
            test-script: scripts/pipeline-streaming-test.sh
            test-object-key: streaming-test-12mb-java.bin
          - stack-name: bedrock-streaming-endpoint
            test-script: scripts/bedrock-streaming-test.sh
            test-object-key: ''
    uses: ./.github/workflows/workflow-streaming-test.yml
    with:
      aws-region: ${{ inputs.aws-region }}
      github-actions-role-name: ${{ inputs.github-actions-role-name || vars.OIDC_ROLE_NAME }}
      stack-name: ${{ matrix.stack-name }}
      test-script: ${{ matrix.test-script }}
      test-object-key: ${{ matrix.test-object-key }}
      # Bedrock test is opt-in (paid). Only the bedrock stack honours this; S3 scripts ignore it.
      bedrock-test-enabled: ${{ matrix.stack-name == 'bedrock-streaming-endpoint' && inputs.run-bedrock-test && 'true' || 'false' }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
