name: CI - CodeQL

# No paths/paths-ignore filter on any trigger: documentation-only changes and
# workflow-only changes must both be analysed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'      # Mondays 04:17 UTC, ahead of Dependabot's Monday 06:00 UTC run

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Exactly these four scopes. No id-token: write -- the reference repository declares
    # it, but nothing here assumes an AWS or OIDC role.
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    strategy:
      # A failure in one language must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      # JDK 25 is the highest toolchain in the build; the foojay resolver in
      # settings.gradle.kts provisions Java 21 for :streaming-core during assemble,
      # so this one setup covers all three modules.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Must sit between init and analyze for build-mode: manual, and runs no test task.
      # It compiles all three modules' sources so CodeQL's manual-mode tracer actually
      # sees them. `clean ... --no-build-cache` is deliberate: CodeQL's tracer only
      # records source when the compiler truly runs under it, but setup-gradle restores
      # the Gradle build cache, so a warm cache serves every compileKotlin/compileJava
      # task FROM-CACHE and no compiler executes — leaving an empty database and the
      # "no source code seen during build" / finalize exit 32 failure. `clean` defeats
      # up-to-date checks on prior build/ outputs; `--no-build-cache` stops classes being
      # pulled from the restored cache. (assemble builds the thin per-module jar, not the
      # shadow jars.)
      - name: Build all modules for extraction
        if: matrix.build-mode == 'manual'
        run: ./gradlew clean assemble --no-build-cache --stacktrace

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
