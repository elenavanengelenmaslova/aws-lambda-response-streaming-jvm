# Dependabot configuration.
#
# One multi-ecosystem group consolidates Gradle and GitHub Actions updates into a single
# weekly pull request. `major`, `minor` and `patch` updates are all permitted: that is what
# omitting an `ignore` block means. Do not add one, and do not add an `allow` allow-list —
# either would narrow the update types below what this repository wants.
#
# The cadence lives on the group ONLY. `schedule` is required on an update entry *unless* that
# entry names a `multi-ecosystem-group` — the group owns the schedule. Duplicating `schedule`
# on a grouped update entry is what GitHub rejected with "Your .github/dependabot.yml contained
# invalid details", so do not put it back on the entries below.
#
# Labels `dependencies`, `gradle` and `github-actions` must exist in the repository;
# Dependabot silently drops labels it cannot find, leaving generated pull requests unlabelled.
#
# `open-pull-requests-limit` must NOT appear on an update entry that belongs to a
# multi-ecosystem group — GitHub rejects the whole config with "open-pull-requests-limit
# should only be set on the associated multi-ecosystem group". It is omitted entirely here
# (the default limit is 5, the value previously set), so no PR-limit key sits on the entries.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

updates:
  - package-ecosystem: gradle
    # Dependabot's Gradle parser does not recurse into Gradle subprojects: each module's build file
    # needs its own directory entry. "/" covers the root build file and gradle/libs.versions.toml.
    directories:
      - "/"
      - "/streaming-core"
      - "/streaming-s3-example"
      - "/streaming-s3-example-java"
    multi-ecosystem-group: all-dependencies
    labels: [dependencies, gradle]
    patterns: ["*"]

  - package-ecosystem: github-actions
    # "/" covers every workflow file under .github/workflows, including the reusable workflows
    # that other workflows reach through `uses:`.
    directory: "/"
    multi-ecosystem-group: all-dependencies
    labels: [dependencies, github-actions]
    patterns: ["*"]
